<mat-toolbar color="primary" class="header-toolbar">
  <!-- Title on the Left -->
  <span class="toolbar-title">{{ 'BOOKMARKER_HEADER.TITLE' | translate }}</span>

  <span class="spacer"></span>

  <div class="search-container">
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      class="search-field"
    >
      <mat-icon matSuffix>search</mat-icon>
      <mat-label>{{ 'BOOKMARKER_HEADER.FILTER' | translate }}</mat-label>
      <input
        type="text"
        matInput
        [(ngModel)]="searchBookmarker"
        autocomplete="off"
        (input)="onSearchBookmarker()"
      />
      @if (searchBookmarker) {
        <button
          matSuffix
          matIconButton
          aria-label="Clear"
          (click)="searchBookmarker = ''; onSearchBookmarker()"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>

  <span class="spacer"></span>

  <div matListItemMeta>
    <a mat-list-item (click)="addBookmarker()">
      <mat-icon
        matTooltip="{{ 'BOOKMARKER_HEADER.ADD_BOOKMARKER' | translate }}"
        >add</mat-icon
      >
    </a>
  </div>
</mat-toolbar>
