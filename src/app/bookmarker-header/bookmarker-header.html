<mat-toolbar>
  <span>Bookmarker</span>
  <div matListItemMeta>
          <a
            mat-list-item
            (click)="addBookmarker();"
          >
          <mat-icon>add</mat-icon>
          </a>
        </div>
        <mat-form-field>
          <input matInput [(ngModel)]="searchBookmarker" placeholder="Filter Bookmarker" autocomplete="off" (input)="onSearchBookmarker()">
        </mat-form-field>
</mat-toolbar>
